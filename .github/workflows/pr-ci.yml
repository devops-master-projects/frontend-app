name: PR CI

on:
  pull_request:
    branches: [ develop, master ]
  push:
    branches: [ feature/** ]   # opcionalno: pali CI i na push u feature granama
  workflow_dispatch:           # ručni trigger u slučaju potrebe

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test (Vitest)
        env:
          VITE_API_URL: http://localhost:8082
        run: npm run test -- --run --coverage

      - name: Build
        env:
          VITE_API_URL: http://localhost:8082
        run: npm run build

  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: frontend-app/commitlint.config.cjs
