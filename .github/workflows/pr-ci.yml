name: CI & Kaniko

on:
  pull_request:
    branches: [ develop, master ]
  push:
    branches: [ develop, master, feature/** ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: write 

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test (Vitest)
        env:
          VITE_API_URL: http://localhost:8082
          VITE_ACCOMMODATION_API_URL: http://localhost:8085
          VITE_CLOUDINARY_CLOUD_NAME: dok1mjki6
          VITE_CLOUDINARY_UPLOAD_PRESET: frontend_upload
          VITE_BOOKING_API_URL: http://localhost:8086
          VITE_SEARCH_API_URL: http://localhost:8087
          VITE_NOTIFICATION_API_URL: http://localhost:8088
        run: npm run test -- --run --coverage

      - name: Build
        env:
          VITE_API_URL: http://localhost:8082
          VITE_ACCOMMODATION_API_URL: http://localhost:8085
          VITE_CLOUDINARY_CLOUD_NAME: dok1mjki6
          VITE_CLOUDINARY_UPLOAD_PRESET: frontend_upload
          VITE_BOOKING_API_URL: http://localhost:8086
          VITE_SEARCH_API_URL: http://localhost:8087
          VITE_NOTIFICATION_API_URL: http://localhost:8088
        run: npm run build

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: frontend-app/commitlint.config.cjs

  kaniko:
    if: github.event_name == 'push'
    needs: [ build-and-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node (for reading package.json version)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute vars
        id: v
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "pkgver=$(node -p "require('./frontend-app/package.json').version")" >> $GITHUB_OUTPUT

      - name: Set image name (GHCR)
        id: img
        run: |
          echo "name=ghcr.io/${{ github.repository_owner }}/frontend-app" >> $GITHUB_OUTPUT

      - name: Compute tags
        id: tags
        run: |
          BR="${{ steps.v.outputs.branch }}"
          PV="${{ steps.v.outputs.pkgver }}"
          SH="${{ steps.v.outputs.sha }}"
          if [ "$BR" = "master" ] || [ "$BR" = "main" ]; then
            TAGS="latest,${PV},${PV}-${SH},sha-${SH}"
          elif [ "$BR" = "develop" ]; then
            TAGS="develop,${PV}-dev-${SH},sha-${SH}"
          else
            SAFE=$(echo "$BR" | tr '/' '-' )
            TAGS="${SAFE},${SAFE}-${SH},sha-${SH}"
          fi
          echo "list=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build & Push with Kaniko (GHCR)
        uses: aevea/action-kaniko@v0.11.0
        with:
          registry: ghcr.io
          image: ${{ steps.img.outputs.name }}
          tag: ${{ steps.tags.outputs.list }}
          path: ./frontend-app
          build_file: ./frontend-app/Dockerfile
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          cache: true
          cache_registry: ${{ steps.img.outputs.name }}-cache